name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Checkout pinned SAFA product contract
        uses: actions/checkout@v7
        with:
          repository: juju-w/safa
          ref: cfb2afecab6cf91afaa8d795ae35fcf2744e07f6
          path: .conformance-upstream/safa-product
      - name: Checkout pinned TOON 4.1.1 reference implementation
        uses: actions/checkout@v7
        with:
          repository: toon-format/toon
          ref: f06ddca16c8a4ccd091f33d7216c543e10a9c681
          path: .conformance-upstream/toon
      - name: Checkout pinned TOON 4.1.1 specification and fixtures
        uses: actions/checkout@v7
        with:
          repository: toon-format/spec
          ref: 62f16b369408180f1faf1cba7da1b46d1f336f12
          path: .conformance-upstream/toon-spec
      - name: Checkout pinned GPT tokenizer data
        uses: actions/checkout@v7
        with:
          repository: niieani/gpt-tokenizer
          ref: 9182f2e567355e0a8f81022b6c52bdc688250ac8
          path: .conformance-upstream/gpt-tokenizer
      - uses: actions/setup-node@v6
        with:
          node-version: 23.7.0
      - name: Resolve dependencies
        run: swift package resolve
      - name: Lint Swift sources
        run: xcrun swift-format lint --recursive --strict Sources Tests Apps/SAFA/Targets Package.swift
      - name: Validate local Runtime packaging metadata
        run: |
          sh -n Scripts/install-local-runtime.sh Scripts/sync-cli-build-metadata.sh \
            Scripts/build-mvp-candidate.sh Scripts/verify-mvp-candidate.sh \
            Scripts/install-mvp-candidate.sh Scripts/rollback-mvp-candidate.sh \
            Scripts/verify-broker-provisioning-profile.sh Scripts/scan-secrets.sh
          Scripts/sync-cli-build-metadata.sh --check
          python3 Scripts/verify-product-source-pinning.py
          Scripts/tests/source-preview-installer-contract.sh
          Scripts/tests/mvp-candidate-contract.sh
          Scripts/scan-secrets.sh
      - name: Build
        run: swift build
      - name: Test
        run: swift test --parallel
      - name: Strict-decode Agent CLI v2 with the pinned TOON reference
        run: >-
          node --no-warnings --experimental-strip-types
          Scripts/verify-toon-conformance.mjs
          .conformance-upstream/toon
          .conformance-upstream/toon-spec
          conformance/toon-v4.1/agent-cli-v2
      - name: Validate exact product contract and fixture pair
        run: >-
          python3 .conformance-upstream/safa-product/tests/validate_runtime_pair.py
          "$GITHUB_WORKSPACE"
      - name: Check the SAFA o200k_base token baseline
        run: >-
          node Scripts/benchmark-agent-cli-v2.mjs
          conformance/toon-v4.1/agent-cli-v2
          benchmarks/agent-cli-v2/compact-json-v1
          .conformance-upstream/gpt-tokenizer/data/o200k_base.tiktoken
      - name: Release build
        run: swift build -c release
      - name: Assemble native runtime targets without signing secrets
        run: >-
          xcodebuild -quiet -project Apps/SAFA/SAFA.xcodeproj -scheme "SAFA Runtime"
          -configuration Debug CODE_SIGNING_ALLOWED=NO build
